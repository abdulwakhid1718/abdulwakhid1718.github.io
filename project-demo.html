<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/demo.css" />
  </head>
  <body>
    <main class="demo-page">
      <section class="demo-shell container">
        <a class="demo-back" href="index.html">← Kembali ke portofolio</a>

        <div class="demo-hero">
          <div class="demo-hero-copy">
            <span class="demo-badge" id="demo-category">Project Demo</span>
            <h1 id="demo-title">Loading...</h1>
            <p id="demo-subtitle" class="demo-subtitle"></p>
            <p id="demo-description" class="demo-description"></p>

            <div class="demo-actions">
              <a class="demo-button primary" href="index.html#portofolio"
                >Lihat portofolio</a
              >
              <a class="demo-button secondary" href="index.html#contact"
                >Hubungi saya</a
              >
            </div>
          </div>

          <div class="demo-visual">
            <div class="demo-window">
              <div class="demo-window-bar">
                <span></span>
                <span></span>
                <span></span>
              </div>
              <div class="demo-window-body" id="demo-preview"></div>
            </div>
          </div>
        </div>

        <div class="demo-grid">
          <article class="demo-card">
            <h2>Tech Stack</h2>
            <div class="demo-tags" id="demo-stack"></div>
          </article>

          <article class="demo-card">
            <h2>Fitur Utama</h2>
            <ul class="demo-list" id="demo-features"></ul>
          </article>

          <article class="demo-card">
            <h2>Highlight</h2>
            <div class="demo-highlights" id="demo-highlights"></div>
          </article>
        </div>
      </section>
    </main>

    <script src="assets/js/project-demo.js"></script>
  </body>
</html>
